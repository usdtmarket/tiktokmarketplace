name: CITYFLOW frontend validation

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-validation.yml"
  push:
    branches: [main, cityflow-v1-sync]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cityflow-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build production bundle
        run: npm run build
